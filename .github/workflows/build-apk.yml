name: Build Veil Music APK

# Cloud build so an APK with the system-bar option can be produced without a
# local JDK 17 + Android SDK 36 toolchain. Optional: delete this file if you
# build locally with `./gradlew :app:assembleDebug`.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null

      - name: Fix wrapper line endings
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Assemble debug and release
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC"

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p ../dist-apk
          find app/build/outputs/apk -name '*.apk' -exec cp {} ../dist-apk/ \; 2>/dev/null || true
          ls -lh ../dist-apk || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-music-apk
          path: dist-apk
          if-no-files-found: warn
          retention-days: 14
