name: Build Veil Music APK

# Cloud build so an APK with the system-bar option can be produced without a
# local JDK 17 + Android SDK 36 toolchain.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      # Runs before checkout, so it must not inherit the job's `app`
      # working directory — that path does not exist yet.
      - name: Workflow marker
        working-directory: .
        run: echo "workflow-rev=4 (no setup-android, sdkmanager with retries)"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The Linux runner already ships an Android SDK, so no third-party setup
      # action is involved (android-actions/setup-android has been failing here).
      - name: Prepare Android SDK
        run: |
          set -u
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Candidate SDK root: $SDK"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK at $SDK"
            exit 1
          fi
          SM="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SM" ]; then
            echo "sdkmanager not found, downloading command-line tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools"
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SM"
          "$SM" --version || true
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          # `tools` is gone from current repositories; only the packages this
          # project actually compiles against are installed, with retries.
          install() {
            for attempt in 1 2 3; do
              if "$SM" --sdk_root="$SDK" --install "$@"; then return 0; fi
              echo "sdkmanager attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            echo "::error::sdkmanager could not install $*"
            return 1
          }
          if [ -d "$SDK/platforms/android-36" ]; then
            echo "platforms;android-36 already present"
          else
            install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Fix wrapper line endings
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Assemble debug
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC"

      # R8 sometimes trips on this project; never let it hide the debug APK.
      - name: Assemble release
        continue-on-error: true
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC"

      - name: Collect APKs
        if: always()
        working-directory: .
        run: |
          mkdir -p dist-apk
          find app/app/build/outputs/apk -name '*.apk' -exec cp {} dist-apk/ \; 2>/dev/null || true
          ls -lh dist-apk || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-music-apk
          path: dist-apk
          if-no-files-found: warn
          retention-days: 14
